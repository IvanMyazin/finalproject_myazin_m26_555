[project]
name = "finalproject_myazin_m26_555"
version = "0.1.0"
description = "Консольное приложение для управления виртуальным валютным портфелем"
readme = "README.md"
authors = [
    { name = "IvanMyazin", email = "myasin-ivanl@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.16.0",
]

[project.scripts]
valutatrade-hub = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.valutatrade]
data_dir = "data"
users_file = "data/users.json"
portfolios_file = "data/portfolios.json"
rates_file = "data/rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
logs_dir = "logs"
log_file = "logs/valutatrade.log"
log_format = "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
